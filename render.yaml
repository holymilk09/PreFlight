# Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Turn-key deploy: connect this repo at render.com/blueprints and Render
# provisions the Postgres + Redis, generates the required secrets, runs the
# database migrations (preDeployCommand) and boots the API — no manual env setup.

services:
  # PreFlight API Service
  - type: web
    name: preflight-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Apply database migrations once per deploy, before the new image goes live.
    # `python -m alembic` avoids depending on the console-script being on PATH.
    preDeployCommand: python -m alembic upgrade head
    envVars:
      # Connection strings come from the managed Postgres/Redis below. The app
      # normalizes the postgres:// scheme to asyncpg automatically (see config.py).
      - key: DATABASE_URL
        fromDatabase:
          name: preflight-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: preflight-redis
          property: connectionString
      # Cryptographic secrets — generated by Render, never committed. Both are
      # validated to be >= 32 chars at boot.
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_SALT
        generateValue: true
      # Governance posture: reject requests when the rate-limit / token-revocation
      # backend is unavailable, and serve API docs off by default in production.
      - key: SECURITY_FAIL_CLOSED
        value: "true"
      - key: ENABLE_DOCS
        value: "false"
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_DSN
        sync: false # Optional, set manually in the dashboard
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 80
      targetCPUPercent: 80

databases:
  # PostgreSQL Database
  - name: preflight-db
    plan: starter # $7/month, upgrade as needed
    databaseName: preflight
    user: preflight

  # Redis Cache (internal, no password — auth is via network isolation)
  - type: redis
    name: preflight-redis
    plan: starter # $7/month
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # only reachable from services in this blueprint
